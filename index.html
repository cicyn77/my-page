<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>纸短情长｜电子手写信</title>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f7f2eb;
      --paper: #fdfaf4;
      --envelope: #e8dcc8;
      --envelope-dark: #d4c4a8;
      --text: #3a3228;
      --text-light: #7c7060;
      --accent: #b8443c;
      --gold: #c49b5c;
      --border: #ddd2be;
      --shadow: 0 10px 30px rgba(40, 25, 15, 0.08);
      --radius: 14px;
      --font-hand: "Noto Serif SC", "STKaiti", KaiTi, 楷体, serif;
      --font-sans: "PingFang SC", "Microsoft YaHei", sans-serif;
      --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    * {margin:0;padding:0;box-sizing:border-box}
    body {
      background: var(--bg);
      background-image: radial-gradient(ellipse at 20% 15%, rgba(180,150,120,0.07) 0%, transparent 55%),radial-gradient(ellipse at 80% 85%, rgba(160,130,100,0.05) 0%, transparent 55%);
      min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;font-family:var(--font-sans);color:var(--text);-webkit-font-smoothing:antialiased;gap:24px;
    }
    .card {width:100%;max-width:500px;background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;border:1px solid var(--border);}
    .top-card {order:1}
    .write-card {order:2;overflow:hidden;transition:max-height var(--transition),padding var(--transition);max-height:72px;padding:20px 28px}
    .write-card.open {max-height:2000px;padding:32px 28px}
    .write-toggle-bar {display:flex;justify-content:space-between;align-items:center}
    .title {font-family:var(--font-hand);font-size:1.7rem;text-align:center;margin-bottom:6px}
    .write-card .title {margin:0}
    .sub-title {text-align:center;color:var(--text-light);font-size:0.95rem;margin-bottom:24px}
    .letter-item {background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;cursor:pointer;border:1px solid #f0e8d9}
    .letter-item h3 {font-family:var(--font-hand);font-size:1.4rem;margin-bottom:4px}
    .letter-item .time {color:var(--text-light);font-size:0.85rem}
    .form-item {margin-bottom:16px}
    .form-item label {display:block;margin-bottom:6px;font-size:0.9rem;color:var(--text-light)}
    .form-item input,.form-item textarea {width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:1rem;background:#fff}
    .form-item textarea {min-height:120px;resize:none}
    .btn {width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;margin-top:8px}
    .toast {position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;display:none}
    .toast.show {display:block}
  </style>
</head>
<body>
  <div class="card top-card">
    <h1 class="title">来自某人的信</h1>
    <p class="sub-title">珍藏每一封温柔的信</p>
    <div id="letterList"></div>
  </div>
  <div class="card write-card" id="writeCard">
    <div class="write-toggle-bar" onclick="toggleWrite()">
      <h2 class="title">执笔写信</h2>
      <span>∨</span>
    </div>
    <div class="write-form" style="margin-top:20px">
      <div class="form-item">
        <label>收信人</label>
        <input type="text" id="to" placeholder="写给谁">
      </div>
      <div class="form-item">
        <label>信件内容</label>
        <textarea id="content" placeholder="写下想说的话"></textarea>
      </div>
      <div class="form-item">
        <label>密码（用于查看）</label>
        <input type="password" id="pwd" placeholder="设置查看密码">
      </div>
      <button class="btn" onclick="saveLetter()">保存信件</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // 云端数据库配置（已经帮你建好，直接用）
    const supabaseUrl = "https://jtnxqkgmzrhsjwhmzr.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJuaW5naDk4NzY1IiwiLCJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    function toggleWrite(){document.getElementById("writeCard").classList.toggle("open")}
    function showToast(msg){
      const t=document.getElementById("toast");
      t.innerText=msg;t.classList.add("show");
      setTimeout(()=>t.classList.remove("show"),2000)
    }

    async function saveLetter(){
      const to=document.getElementById("to").value.trim();
      const content=document.getElementById("content").value.trim();
      const pwd=document.getElementById("pwd").value;
      if(!to||!content||!pwd)return showToast("请填写完整");
      const encrypt=CryptoJS.AES.encrypt(content,pwd).toString();
      await supabase.from("letters").insert([{to,pwd,encrypt,time:new Date().toLocaleString()}]);
      showToast("信件已云端保存！");
      document.getElementById("to").value="";
      document.getElementById("content").value="";
      document.getElementById("pwd").value="";
      loadLetters();
    }

    async function loadLetters(){
      const {data}=await supabase.from("letters").select("*").order("time",{ascending:false});
      const list=document.getElementById("letterList");
      list.innerHTML="";
      data.forEach(item=>{
        const div=document.createElement("div");
        div.className="letter-item";
        div.innerHTML=`<h3>${item.to}</h3><div class="time">${item.time}</div>`;
        div.onclick=()=>{
          const p=prompt("请输入查看密码");
          try{
            const d=CryptoJS.AES.decrypt(item.encrypt,p).toString(CryptoJS.enc.Utf8);
            if(d)alert("信件内容：\n\n"+d);
            else showToast("密码错误");
          }catch{showToast("密码错误")}
        };
        list.appendChild(div);
      })
    }

    window.onload=loadLetters;
  </script>
</body>
</html>
