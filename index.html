<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>纸短情长｜电子手写信</title>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <style>
    :root {
      --bg: #f7f2eb;
      --paper: #fdfaf4;
      --envelope: #e8dcc8;
      --envelope-dark: #d4c4a8;
      --text: #3a3228;
      --text-light: #7c7060;
      --accent: #b8443c;
      --gold: #c49b5c;
      --border: #ddd2be;
      --shadow: 0 10px 30px rgba(40, 25, 15, 0.08);
      --radius: 14px;
      --font-hand: "Noto Serif SC", "STKaiti", KaiTi, 楷体, serif;
      --font-sans: "PingFang SC", "Microsoft YaHei", sans-serif;
      --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      font-family: var(--font-sans);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      gap: 24px;
    }
    .card {
      width: 100%;
      max-width: 500px;
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      border: 1px solid var(--border);
      position: relative;
    }
    .top-card {
      order: 1;
    }
    .write-card {
      order: 2;
      overflow: hidden;
      transition: max-height var(--transition), padding var(--transition);
      max-height: 72px;
      padding: 20px 28px;
    }
    .write-card.open {
      max-height: 2000px;
      padding: 32px 28px;
    }
    .write-toggle-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-family: var(--font-hand);
      font-size: 1.7rem;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }
    .write-card .title {
      margin: 0;
      text-align: left;
    }
    .toggle-icon {
      font-size: 1.4rem;
      color: var(--gold);
      transition: transform var(--transition);
      cursor: pointer;
    }
    .write-card.open .toggle-icon {
      transform: rotate(180deg);
    }
    .subtitle {
      text-align: center;
      font-size: 0.84rem;
      color: var(--text-light);
      margin-bottom: 24px;
    }
    .write-content {
      margin-top: 20px;
    }
    .form-item {
      margin-bottom: 16px;
    }
    .form-item label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-light);
      margin-bottom: 6px;
    }
    .form-item input,
    .form-item textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      background: #fefdf9;
      outline: none;
      transition: 0.25s;
    }
    .form-item textarea {
      min-height: 110px;
      font-family: var(--font-hand);
      line-height: 1.75;
      resize: vertical;
    }
    .form-item input:focus,
    .form-item textarea:focus {
      border-color: var(--gold);
      background: #fff;
    }
    .img-preview-wrap {
      display: none;
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border);
      position: relative;
    }
    .img-preview-wrap img {
      max-width: 100%;
      max-height: 180px;
      display: block;
    }
    .img-del {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    .btn {
      padding: 13px;
      border-radius: 40px;
      border: none;
      font-size: 0.92rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: #a0362e;
    }
    .letter-list {
      list-style: none;
      max-height: 360px;
      overflow-y: auto;
    }
    .letter-item {
      padding: 14px 16px;
      border-radius: 10px;
      background: #fefdf9;
      margin-bottom: 8px;
      border: 1.5px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .letter-item:hover {
      border-color: var(--border);
      background: #fffefb;
    }
    .letter-info h4 {
      font-family: var(--font-hand);
      font-weight: 600;
      font-size: 0.94rem;
    }
    .letter-info p {
      font-size: 0.72rem;
      color: #aaa;
      text-align: left;
    }
    .empty {
      text-align: center;
      padding: 40px 0;
      color: #c5bdb5;
      font-size: 0.92rem;
    }
    .envelope-box {
      perspective: 1200px;
      margin: 20px 0;
      display: flex;
      justify-content: center;
    }
    .envelope {
      width: 190px;
      height: 135px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: default;
    }
    .envelope.flip {
      transform: rotateY(180deg);
    }
    .env-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .env-front {
      background: var(--envelope);
      border: 2px solid var(--envelope-dark);
      position:relative;
      overflow:hidden;
    }
    .env-front::before{
      content:"";
      position:absolute;
      top:0;left:0;right:0;
      height:50%;
      background:var(--envelope-dark);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      opacity:0.3;
    }
    .seal-stamp {
      width:44px;
      height:44px;
      border-radius:50%;
      background:#b8443c;
      color:#fff;
      display:grid;
      place-items:center;
      font-weight:bold;
      font-size:16px;
      box-shadow:0 2px 8px rgba(184,68,60,0.4);
      position:relative;
      z-index:2;
    }
    .env-back {
      background: var(--paper);
      border: 2px solid var(--border);
      transform: rotateY(180deg);
      padding: 16px;
      text-align: center;
      overflow: hidden;
    }
    .read-view h2 {
      font-family: var(--font-hand);
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    .read-date {
      text-align: left;
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 16px;
    }
    .read-content {
      font-family: var(--font-hand);
      line-height: 1.8;
      white-space: pre-wrap;
      padding: 16px 0;
      border-top: 1px dashed var(--border);
      border-bottom: 1px dashed var(--border);
    }
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: #3a3228;
      color: #f5f0e8;
      padding: 10px 26px;
      border-radius: 40px;
      font-size: 0.86rem;
      transition: transform 0.4s;
      z-index: 999;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
    .view {
      display: none;
    }
    .view.active {
      display: flex;
      flex-direction: column;
    }
    .unlock-center-btn{
      width:100%;
      max-width:220px;
      margin:0 auto;
    }
    .read-audio{
      width:100%;
      margin-bottom:12px;
      display:flex;
      justify-content:center;
    }
    .read-audio audio{
      width:100%;
      max-width:100%;
    }
    .read-img{
      text-align:center;
      margin-bottom:12px;
    }
    .ops-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }
    @media (max-width: 720px) {
      .card {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div class="card top-card" id="readBox">
  <div class="view active" id="listView">
    <h2 class="title">来自某人的信</h2>
    <p class="subtitle">珍藏每一封温柔的信</p>
    <ul class="letter-list" id="list"></ul>
  </div>
  <div class="view" id="unlockView">
    <h2 class="title">开启信封</h2>
    <p id="unlockTitle" class="subtitle"></p>
    <div class="envelope-box">
      <div class="envelope" id="env">
        <div class="env-face env-front">
          <div class="seal-stamp">信</div>
        </div>
        <div class="env-face env-back">
          <h4 id="envTitle"></h4>
          <p id="envText" style="font-size:0.78rem;color:#7c7060;max-height:60px;overflow:hidden"></p>
        </div>
      </div>
    </div>
    <div class="unlock-center-btn">
      <div class="form-item">
        <input type="password" id="unlockPwd" placeholder="输入密码解锁" />
      </div>
      <button class="btn btn-primary" onclick="checkPwd()" style="width:100%">开启信</button>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
        <button class="ops-btn" onclick="backList()">返回信箱</button>
      </div>
    </div>
  </div>
  <div class="view" id="readView">
    <h2 id="readTitle"></h2>
    <p class="read-date" id="readTime"></p>
    <div class="read-audio" id="readAudio"></div>
    <div class="read-img" id="readImg"></div>
    <div class="read-content" id="readText"></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
      <button class="ops-btn" onclick="backList()">返回信箱</button>
    </div>
  </div>
</div>

<div class="card write-card" id="writeCard">
  <div class="write-toggle-bar">
    <h2 class="title">执笔写信</h2>
    <span class="toggle-icon" onclick="toggleWrite()">⌄</span>
  </div>
  <div class="write-content">
    <div class="form-item">
      <label>信件标题</label>
      <input type="text" id="title" placeholder="给这封信取个温柔的名字" maxlength="60" />
    </div>
    <div class="form-item">
      <label>信件正文</label>
      <textarea id="content" placeholder="写下想对TA说的话……"></textarea>
    </div>
    <div class="form-item">
      <label>附上照片（可选）</label>
      <input type="file" id="imgUpload" accept="image/*" />
      <div class="img-preview-wrap" id="imgWrap">
        <img id="imgPre" />
        <button class="img-del" onclick="removeImg();event.stopPropagation()">×</button>
      </div>
    </div>
    <div class="form-item">
      <label>背景音乐｜网易云链接</label>
      <input type="text" id="music" placeholder="粘贴网易云歌曲分享链接" />
    </div>
    <div class="form-item">
      <label>设置密码｜钥匙</label>
      <input type="password" id="pwd" placeholder="对方凭此密码查看" />
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="saveLetter()">封缄 · 存入信箱</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = "letter_final_zhuzhu_rect";
  let letters = [];
  let currentImg = null;
  let targetId = null;
  let flippedOnce = false;
  const toast = document.getElementById("toast");

  function toggleWrite() {
    document.getElementById("writeCard").classList.toggle("open");
  }
  function init() {
    load();
    renderList();
    document.getElementById("unlockPwd").addEventListener("keydown", (e) => e.key === "Enter" && checkPwd());
  }
  function load() {
    try { 
      letters = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; 
      if (letters.length === 0) {
        const payload = {
          text: `亲爱的竹竹：
展信安好。

无论什么事，我第一想到的永远是先分享给你。那些发消息时的雀跃和待回复的期许让人感到安心，因为我知道你一定会回我。

虽然我们远隔重洋还没面基过，彼此之间仍然有许多未曾知晓的细碎过往，可对我而言，你是那无可替代的挚友，这可以称为“电子闺蜜”吗哈哈哈。

我们默契地保留着恰到好处的距离，不刻意窥探彼此的日常，不远不近。但我始终能清晰感受到，你心有我，这就足够了。

许久以来，我一直都是一个人。身边虽然也有过许多朋友，但一旦回到私下就不在有交集；很少拥有一段能长久维系、时时有音讯往来的情谊。

只有你，会接住我所有鸡毛蒜皮的小事。无论我发再多消息，只要你有空，便会耐心作答。一直以来你都包容我的小幼稚，陪我嬉笑打闹，被这般珍视的时刻，我满心欢喜、很幸福。

我俩从来不会向对方倾诉那些负面情绪，总是把美好的一面展现给彼此。但其实长久以来，我一直再焦虑和内耗中；一直不理想的学业，让我对未来感到恐惧，不知该怎么办。直到前段时间，我决定不再继续读书，那颗一直压在胸口的石头如释负重，总算能让人喘口气。所以不要太担心！

好在这一年，你始终在我身旁，给了我许多坚持下去的动力，让我一直坚持到现在。特别庆幸跟竹竹认识，也特别想念你，等有机会我一定要回国找你玩！！

也希望在那些我没能参与的日子里，你一切顺遂，平安无忧。要是心里有委屈、烦心事想倾诉，尽管跟我说，我会一直陪着你、支持你。

只愿这份柔软真挚的情谊久伴不散。
往后的日子也请多多关照，
爱你的cc💗💗`,
          imageBase64: "https://51img2.51txapp.com/2026/04/22/52a33be951a640bfb0b5e2e355feda83!400x400.jpeg",
          musicUrl: "https://music.163.com/song/media/outer/url?id=3368153040.mp3",
          musicId: "3368153040"
        };
        const encrypted = CryptoJS.AES.encrypt("LETTER:" + JSON.stringify(payload), "0208").toString();
        const defaultLetter = {
          id: "L_zhuzhu_love_rect",
          title: "至亲爱的竹竹",
          encryptedContent: encrypted,
          createdAt: "2026-05-20T00:00:00.000Z"
        };
        letters.unshift(defaultLetter);
        save();
      }
    } catch { 
      letters = []; 
    }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(letters));
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
  }
  document.getElementById("imgUpload").onchange = function (e) {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith("image/")) return showToast("请选择图片");
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        let w = img.width, h = img.height, max = 900;
        if (w > max || h > max) { const r = Math.min(max / w, max / h); w *= r; h *= r; }
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        currentImg = c.toDataURL("image/jpeg", 0.78);
        document.getElementById("imgPre").src = currentImg;
        document.getElementById("imgWrap").style.display = "block";
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  function removeImg() {
    currentImg = null;
    document.getElementById("imgWrap").style.display = "none";
    document.getElementById("imgUpload").value = "";
  }
  function saveLetter() {
    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();
    let music = document.getElementById("music").value.trim();
    const pwd = document.getElementById("pwd").value;
    if (!title) return showToast("请填写信件标题");
    if (!content && !currentImg && !music) return showToast("至少填写一项内容");
    if (!pwd || pwd.length < 2) return showToast("密码至少2位");
    let musicId = null;
    if (music && music.includes("music.163.com")) {
      const m = music.match(/id=(\d+)/);
      if (m) { musicId = m[1]; music = `https://music.163.com/song/media/outer/url?id=${musicId}.mp3`; }
    }
    const payload = { text: content, imageBase64: currentImg, musicUrl: music, musicId };
    const encrypt = CryptoJS.AES.encrypt("LETTER:" + JSON.stringify(payload), pwd).toString();
    const letter = { id: "L" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), title, encryptedContent: encrypt, createdAt: new Date().toISOString() };
    letters.unshift(letter); save();
    showToast("信件已封缄存入信箱");
    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    document.getElementById("music").value = "";
    document.getElementById("pwd").value = "";
    removeImg(); renderList();
    document.getElementById("writeCard").classList.remove("open");
  }
  function renderList() {
    const ul = document.getElementById("list");
    if (letters.length === 0) { ul.innerHTML = '<li class="empty">信箱暂无信件</li>'; return; }
    ul.innerHTML = letters.map(l => {
      const t = new Date(l.createdAt).toLocaleDateString("zh-CN");
      return `
        <li class="letter-item" onclick="openUnlock('${l.id}')">
          <div class="letter-info">
            <h4>${html(l.title)}</h4>
            <p>${t}</p>
          </div>
          <div></div>
        </li>`;
    }).join("");
  }
  function html(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function openUnlock(id) {
    targetId = id; flippedOnce = false;
    const l = letters.find(x => x.id === id);
    document.getElementById("unlockTitle").textContent = "「" + l.title + "」";
    document.getElementById("unlockPwd").value = "";
    document.getElementById("env").classList.remove("flip");
    document.getElementById("envTitle").textContent = "";
    document.getElementById("envText").textContent = "";
    switchView("unlockView");
  }
  function checkPwd() {
    const pwd = document.getElementById("unlockPwd").value;
    if (!pwd) return showToast("请输入密码");
    const l = letters.find(x => x.id === targetId);
    let dec;
    try { dec = CryptoJS.AES.decrypt(l.encryptedContent, pwd).toString(CryptoJS.enc.Utf8); } catch { dec = ""; }
    if (!dec || !dec.startsWith("LETTER:")) return showToast("密码错误");
    if (!flippedOnce) {
      document.getElementById("env").classList.add("flip");
      flippedOnce = true;
    }
    showToast("密码正确");
    const payload = JSON.parse(dec.slice(7));
    document.getElementById("envTitle").textContent = l.title;
    document.getElementById("envText").textContent = (payload.text || "").slice(0, 40) + "…";
    setTimeout(() => openRead(payload, l), 800);
  }
  function openRead(payload, letter) {
    document.getElementById("readTitle").textContent = letter.title;
    document.getElementById("readTime").textContent = "写于 " + new Date(letter.createdAt).toLocaleDateString("zh-CN");
    document.getElementById("readText").textContent = payload.text || "";
    
    if (payload.musicUrl) {
      const audio = new Audio(payload.musicUrl);
      audio.controls = true;
      audio.muted = false;
      audio.play().catch(() => {});
      document.getElementById("readAudio").innerHTML = "";
      document.getElementById("readAudio").appendChild(audio);
    } else {
      document.getElementById("readAudio").innerHTML = "";
    }
    // 核心修改：改成**横向长方形**，宽>高，和你截图效果一致
    document.getElementById("readImg").innerHTML = payload.imageBase64 
      ? `<img src="${payload.imageBase64}" style="width:100%;height:180px;border-radius:10px;border:2px solid var(--border);object-fit:cover;">` 
      : "";
    switchView("readView");
  }
  function backList() {
    const audio = document.querySelector("#readAudio audio");
    if (audio) audio.pause();
    switchView("listView");
    renderList();
  }
  function switchView(name) {
    ["listView", "unlockView", "readView"].forEach(n => document.getElementById(n).classList.remove("active"));
    document.getElementById(name).classList.add("active");
  }

  window.onload = function () {
    init();
  }
</script>
</body>
</html>
